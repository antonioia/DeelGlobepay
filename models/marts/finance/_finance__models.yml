version: 2

models:
  - name: fct_globepay_transactions
    description: >
      One row per Globepay payment attempt, with its outcome (accepted/declined), the amount
      in local currency and in USD, and its chargeback status from the chargeback report.
      Built for the Data Analyst to answer: acceptance rate over time, declined amount (USD)
      by country, and which transactions are missing chargeback data.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_globepay__acceptances')
    columns:
      - name: transaction_id
        description: >
          Globepay transaction ID (CSV column `external_ref`). Primary key, shared with the chargeback report.
          Not the `evt_...` ID that the API spec calls `external_ref`: that one is `event_id` (see `docs/ingestion_and_modeling.md`, section 1.4).
        data_tests:
          - unique
          - not_null
      - name: event_id
        description: Globepay event ID (CSV column `ref`, `evt_...`). The API spec calls this value `external_ref` (see `docs/ingestion_and_modeling.md`, section 1.4).
      - name: transaction_at
        description: UTC timestamp of the payment attempt.
      - name: transaction_date
        description: UTC date of the payment attempt, to aggregate metrics over time (day/week/month).
      - name: country_code
        description: >
          Two-letter country code of the card. Note: the United Kingdom is reported as `UK`.
      - name: currency_code
        description: >
          Three-letter code of the transaction currency. Note: AE (United Arab Emirates)
          transactions are in USD, not AED.
      - name: transaction_state
        description: Outcome of the payment attempt as reported by Globepay (`ACCEPTED` or `DECLINED`).
      - name: is_accepted
        description: >
          TRUE if the payment attempt was accepted. Acceptance rate = share of rows with
          `is_accepted = TRUE`.
      - name: is_cvv_provided
        description: TRUE if the card CVV was provided in the payment request.
      - name: amount_local
        description: >
          Transaction amount in the local currency (`currency_code`), in major units
          (assumption: the Globepay API spec says minor units, see `docs/ingestion_and_modeling.md`, section 1.3).
      - name: fx_rate_to_usd
        description: Units of `currency_code` per 1 USD applied by Globepay (1 for USD).
      - name: amount_usd
        description: Transaction amount in USD (`amount_local / fx_rate_to_usd`). Use it to compare amounts across countries.
      - name: has_chargeback_data
        description: >
          TRUE if the transaction has a row in the chargeback report. FALSE means chargeback
          data is missing for this transaction.
      - name: is_chargeback
        description: >
          TRUE if the transaction was charged back, FALSE if not. NULL when the chargeback
          data is missing (`has_chargeback_data = FALSE`): unknown, not "no chargeback".
        data_tests:
          - not_null:
              config:
                where: "has_chargeback_data"
